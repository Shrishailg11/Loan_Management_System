spring.application.name=loan-management-system

# Database (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loan_db}
spring.datasource.username=${DB_USERNAME:loan_user}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only validates the schema; Flyway will own it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev-only: show SQL while learning (turn off in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Initial admin (optional; used only if no such user exists yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}