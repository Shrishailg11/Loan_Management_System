spring.application.name=loan-management-system

# Database (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loan_db}
spring.datasource.username=${DB_USERNAME:loan_user}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only validates the schema; Flyway will own it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev-only: show SQL while learning (turn off in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Initial admin (optional; used only if no such user exists yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Overdue job (second minute hour day month weekday); default is 9:00 every day
app.overdue.cron=0 0 9 * * *

# Mail (defaults point at a local fake SMTP server such as Mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:noreply@loanbank.local}
app.mail.enabled=${MAIL_ENABLED:true}